name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión semver (ej. 1.2.0)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.14-slim
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.6"
      - run: uv sync --frozen --all-groups --no-install-project
      - run: uv run pytest -q
      - name: Build inmutable
        env:
          PDF_EXTRACT_VERSION: ${{ inputs.version }}
          SOURCE_DATE_EPOCH: ${{ github.event.repository.updated_at }}
        run: uv run python -m scripts.build
      - name: Manifiesto de release
        env:
          PDF_EXTRACT_VERSION: ${{ inputs.version }}
        run: uv run python -m scripts.release
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.version }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.version }}
          path: dist
      - name: Publicar artefacto con tag inmutable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
