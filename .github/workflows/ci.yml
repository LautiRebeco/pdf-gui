name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    container: python:3.14-slim
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.6"
      - name: Instalar dependencias (lock fijo)
        run: uv sync --frozen --all-groups --no-install-project
      - name: Lock actualizado
        run: uv lock --check
      - name: Formato
        run: uv run black --check .
      - name: Lint
        run: uv run flake8 .
      - name: Tests
        run: uv run pytest -q
      - name: Auditoría de dependencias
        run: uv run pip-audit --progress-spinner off
      - name: Build (separado de release)
        run: PDF_EXTRACT_VERSION=${{ github.sha }} uv run python -m scripts.build
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-extractext-gui-${{ github.sha }}
          path: dist/*
